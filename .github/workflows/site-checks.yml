# Runs lint, type checks, tests and the full build on every change, so nothing
# broken reaches main, whoever pushes it (the Novalab bot, Claude, or the team).
# Vercel still builds the preview and production deploys; this only checks.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
